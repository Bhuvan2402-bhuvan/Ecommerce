# Test configuration using H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

jwt.secret=TestSecretKeyForShopSphereJWTThatIsAtLeast256BitsLong!!!!
jwt.expiration=3600000

app.cors.allowed-origins=http://localhost:5173
app.admin.email=admin@test.com
app.admin.password=Admin@123456

logging.level.com.shopsphere=WARN
