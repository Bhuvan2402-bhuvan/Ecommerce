# ===================================================
# ShopSphere - Application Configuration
# ===================================================

# Optional local overrides (gitignored)
spring.config.import=optional:classpath:application-local.properties

# Server
server.port=${SERVER_PORT:8080}

# DataSource - PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/shopsphere}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyForShopSphereJWTThatIsAtLeast256BitsLong!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# Admin setup
app.admin.email=${ADMIN_EMAIL:admin@shopsphere.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123456}

# Logging
logging.level.com.shopsphere=INFO
logging.level.org.springframework.security=WARN

# Supabase
supabase.url=${SUPABASE_URL:https://xrmdrygikxggkprxvxpz.supabase.co}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
supabase.secret-key=${SUPABASE_SECRET_KEY:}
supabase.jwks-url=${SUPABASE_JWKS_URL:https://xrmdrygikxggkprxvxpz.supabase.co/auth/v1/.well-known/jwks.json}
